<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_25 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_25" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_25');
  const devicePixelRatio = window.devicePixelRatio || 1;
  <threejs-scene>
  // MaatriMarg Hero Scene - Pulse & Floating Nodes
  // Setup handled by platform custom tag
  
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  camera.position.z = 5;
  
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);
  
  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0x2dd4bf, 1);
  pointLight.position.set(5, 5, 5);
  scene.add(pointLight);
  
  // Materials
  const coreMaterial = new THREE.MeshPhongMaterial({
    color: 0x0f172a,
    emissive: 0x0f172a,
    transparent: true,
    opacity: 0.8,
    shininess: 100
  });
  
  const nodeMaterial = new THREE.MeshPhongMaterial({
    color: 0x2dd4bf,
    transparent: true,
    opacity: 0.6
  });
  
  // Geometry - Central AI Core
  const coreGeo = new THREE.IcosahedronGeometry(1.2, 2);
  const core = new THREE.Mesh(coreGeo, coreMaterial);
  scene.add(core);
  
  // Floating Nodes (Hospitals/Mothers)
  const nodes = [];
  const lineMaterial = new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.2 });
  
  for (let i = 0; i < 6; i++) {
    const nodeGeo = new THREE.SphereGeometry(0.15, 16, 16);
    const node = new THREE.Mesh(nodeGeo, nodeMaterial);
    
    const angle = (i / 6) * Math.PI * 2;
    const radius = 3;
    node.position.x = Math.cos(angle) * radius;
    node.position.y = Math.sin(angle) * radius;
    node.position.z = (Math.random() - 0.5) * 2;
    
    scene.add(node);
    nodes.push(node);
    
    // Connection Lines
    const points = [new THREE.Vector3(0,0,0), node.position];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(lineGeo, lineMaterial);
    scene.add(line);
  }
  
  // Render loop
  function animate(time) {
    requestAnimationFrame(animate);
    
    core.rotation.y += 0.005;
    core.rotation.x += 0.003;
    
    // Pulse effect
    const pulse = Math.sin(time * 0.002) * 0.1 + 1;
    core.scale.set(pulse, pulse, pulse);
    
    nodes.forEach((node, i) => {
      node.position.y += Math.sin(time * 0.001 + i) * 0.005;
    });
    
    renderer.render(scene, camera);
  }
  
  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });
  
  animate(0);
</threejs-scene>
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_25 -->
</body>
</html>
