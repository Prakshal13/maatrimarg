<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_33 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_33" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_33');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // MaatriMarg Hero Scene - Enhanced Pulse & Floating Nodes
// Setup handled by platform custom tag

const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const mainLight = new THREE.DirectionalLight(0x2dd4bf, 1);
mainLight.position.set(5, 5, 5);
scene.add(mainLight);

// Materials
const coreMaterial = new THREE.MeshPhongMaterial({
  color: 0x0f172a,
  emissive: 0x1e293b,
  transparent: true,
  opacity: 0.9,
  shininess: 100
});

const nodeMaterial = new THREE.MeshPhongMaterial({
  color: 0x2dd4bf,
  transparent: true,
  opacity: 0.7
});

const lineMaterial = new THREE.LineBasicMaterial({ 
  color: 0x2dd4bf, 
  transparent: true, 
  opacity: 0.3 
});

// Geometry - Central AI Core (MaatriMarg Intel)
const coreGeo = new THREE.IcosahedronGeometry(1.3, 2);
const core = new THREE.Mesh(coreGeo, coreMaterial);
scene.add(core);

// Outer ring for core
const ringGeo = new THREE.TorusGeometry(1.6, 0.02, 16, 100);
const ring = new THREE.Mesh(ringGeo, nodeMaterial);
ring.rotation.x = Math.PI / 2;
scene.add(ring);

// Floating Nodes (Hospitals/Mothers)
const nodes = [];
const lines = [];

for (let i = 0; i < 8; i++) {
  const nodeGeo = new THREE.SphereGeometry(0.12, 16, 16);
  const node = new THREE.Mesh(nodeGeo, nodeMaterial);
  
  const angle = (i / 8) * Math.PI * 2;
  const radius = 3.2;
  node.position.x = Math.cos(angle) * radius;
  node.position.y = Math.sin(angle) * radius;
  node.position.z = (Math.random() - 0.5) * 1.5;
  
  scene.add(node);
  nodes.push(node);
  
  // Connection Lines
  const points = [new THREE.Vector3(0,0,0), node.position];
  const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
  const line = new THREE.Line(lineGeo, lineMaterial);
  scene.add(line);
  lines.push(line);
}

// Render loop
function animate(time) {
  requestAnimationFrame(animate);
  
  const slowTime = time * 0.001;
  
  core.rotation.y += 0.004;
  core.rotation.z += 0.002;
  ring.rotation.z -= 0.003;
  
  // Pulse effect
  const pulse = Math.sin(slowTime * 1.5) * 0.08 + 1;
  core.scale.set(pulse, pulse, pulse);
  
  nodes.forEach((node, i) => {
    // Subtle float
    node.position.y += Math.sin(slowTime + i) * 0.002;
    node.position.x += Math.cos(slowTime + i) * 0.001;
    
    // Update lines
    const positions = lines[i].geometry.attributes.position.array;
    positions[3] = node.position.x;
    positions[4] = node.position.y;
    positions[5] = node.position.z;
    lines[i].geometry.attributes.position.needsUpdate = true;
  });
  
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

animate(0);
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_33 -->
</body>
</html>
