<style>
        body {
            background-color: #f7f9fb;
            background-image: radial-gradient(#e0e3e5 1px, transparent 1px);
            background-size: 24px 24px;

        .glass-card {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
        }

<body class="min-h-screen flex items-center justify-center p-gutter"><div class="absolute top-4 right-4 flex items-center gap-4">
    <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-outline text-[20px]">language</span>
        <select class="bg-transparent border-none font-label-caps text-label-caps text-on-surface-variant focus:ring-0 cursor-pointer py-0 pl-0 pr-6">
            <option value="en">English</option>
            <option value="mr">मराठी</option>
        </select>
    </div>
    <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-highest transition-all text-on-surface-variant" aria-label="Toggle Dark Mode">
        <span class="material-symbols-outlined text-[20px]">dark_mode</span>
    </button>
</div>
<main class="w-full max-w-md mx-auto">
<div class="glass-card rounded-xl overflow-hidden p-stack-lg flex flex-col gap-stack-lg">
<!-- Header / Brand -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center mb-stack-sm border border-surface-border">
<span class="material-symbols-outlined text-[32px] text-medical-blue-muted">admin_panel_settings</span>
</div>
<h1 class="font-headline-md text-headline-md text-medical-blue-muted">MaatriMarg</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Secure access to Maharashtra Maternal Healthcare Intelligence Platform.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault(); window.location.href='/dashboard';">
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="clinician_id">Clinician ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">badge</span>
<input class="w-full bg-surface-container-lowest border border-surface-border rounded-lg py-2.5 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-teal-accent focus:ring-1 focus:ring-teal-accent transition-all" id="clinician_id" name="clinician_id" placeholder="e.g. MH-DOC-8492" required="" type="text">
</div>
</div>
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Security Key</label>
<a class="font-label-caps text-label-caps text-teal-accent hover:opacity-80 transition-opacity" href="#">Forgot Key?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">key</span>
<input class="w-full bg-surface-container-lowest border border-surface-border rounded-lg py-2.5 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-teal-accent focus:ring-1 focus:ring-teal-accent transition-all" id="password" name="password" placeholder="Enter secure key" required="" type="password">
</div>
</div>
<div class="flex items-center gap-2 mt-2">
<input class="rounded border-surface-border text-medical-blue-muted focus:ring-teal-accent h-4 w-4" id="remember" type="checkbox">
<label class="font-body-md text-body-md text-on-surface-variant" for="remember">Verify device for 30 days</label>
</div>
<button class="mt-stack-sm w-full bg-medical-blue-muted text-on-primary rounded-lg py-3 font-title-sm text-title-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-[20px]">login</span>
                    Authenticate Access
                </button>
</form>
<div class="text-center border-t border-surface-border pt-stack-md mt-stack-sm">
<p class="font-label-caps text-label-caps text-outline flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">shield</span>
                    End-to-End Encrypted Session
                </p>
</div>
</div>
</main>
